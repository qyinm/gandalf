name: Agent Environment Drift Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-drift:
    name: Gandalf Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      - name: Run Gandalf Check Action
        uses: ./
        with:
          fail-on-drift: 'true'
