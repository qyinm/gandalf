name: 'Gandalf Agent Environment Drift Check'
description: 'Enforce team AI agent configuration (Claude Code, Codex, Cursor) in CI PR gates'
author: 'qyinm'
branding:
  icon: 'shield'
  color: 'red'

inputs:
  manifest:
    description: 'Path to gandalf.toml (default: auto-detected in project root)'
    required: false
    default: ''
  project-path:
    description: 'Project root directory'
    required: false
    default: '.'
  fail-on-drift:
    description: 'Fail the workflow if configuration drift or errors are detected'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run Gandalf Check
      shell: bash
      env:
        INPUT_MANIFEST: ${{ inputs.manifest }}
        INPUT_PROJECT: ${{ inputs.project-path }}
        INPUT_FAIL_ON_DRIFT: ${{ inputs.fail-on-drift }}
      run: |
        set -e

        # 1. Resolve Gandalf binary
        GANDALF_BIN=""
        if command -v gandalf >/dev/null 2>&1; then
          GANDALF_BIN="gandalf"
        elif [ -f "${GITHUB_ACTION_PATH}/bin/gandalf" ]; then
          GANDALF_BIN="${GITHUB_ACTION_PATH}/bin/gandalf"
        elif command -v go >/dev/null 2>&1; then
          echo "Compiling Gandalf CLI via Go toolchain..."
          BUILD_DIR=$(mktemp -d)
          if [ -f "${GITHUB_ACTION_PATH}/cmd/gandalf/main.go" ]; then
            (cd "${GITHUB_ACTION_PATH}" && go build -o "${BUILD_DIR}/gandalf" ./cmd/gandalf)
          elif [ -f "${GITHUB_WORKSPACE}/cmd/gandalf/main.go" ]; then
            (cd "${GITHUB_WORKSPACE}" && go build -o "${BUILD_DIR}/gandalf" ./cmd/gandalf)
          else
            go install github.com/qyinm/gandalf/cmd/gandalf@latest
            GANDALF_BIN="$(go env GOPATH)/bin/gandalf"
          fi
          if [ -z "$GANDALF_BIN" ]; then
            GANDALF_BIN="${BUILD_DIR}/gandalf"
          fi
        else
          echo "::error::Gandalf binary or Go compiler not found on runner."
          exit 1
        fi

        # 2. Build flags
        ARGS=("--project-only")
        if [ "$INPUT_FAIL_ON_DRIFT" = "true" ]; then
          ARGS+=("--ci")
        fi
        if [ -n "$INPUT_MANIFEST" ]; then
          ARGS+=("--manifest" "$INPUT_MANIFEST")
        fi
        if [ -n "$INPUT_PROJECT" ]; then
          ARGS+=("--project" "$INPUT_PROJECT")
        fi

        echo "Running: $GANDALF_BIN check ${ARGS[*]}"
        "$GANDALF_BIN" check "${ARGS[@]}"
